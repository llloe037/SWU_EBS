<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - SWU Equipment Borrowing System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <!-- Header สีแดง มศว -->
        <div class="bg-[#9e1b32] p-8 text-white text-center">
            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center text-[#9e1b32] font-bold text-xl mx-auto mb-3 shadow">
                มศว
            </div>
            <h1 class="text-xl font-bold">เข้าสู่ระบบยืม-คืนอุปกรณ์</h1>
            <p class="text-xs text-red-100 mt-1">Srinakharinwirot University (SWU ERP)</p>
        </div>

        <!-- ฟอร์มเข้าสู่ระบบ -->
        <form method="POST" class="p-8 space-y-5">
            {% csrf_token %}

            <!-- แจ้งเตือนกรณีใส่รหัสผ่านผิด -->
            {% if form.errors %}
            <div class="bg-red-50 text-red-600 p-3 rounded-lg text-xs border border-red-200">
                Buasri ID หรือ รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง
            </div>
            {% endif %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Buasri ID / ชื่อผู้ใช้</label>
                <input type="text" name="username" required placeholder="เช่น somchai.j" 
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#9e1b32]/20 focus:border-[#9e1b32]">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน (Password)</label>
                <input type="password" name="password" required placeholder="••••••••" 
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#9e1b32]/20 focus:border-[#9e1b32]">
            </div>

            <button type="submit" class="w-full bg-[#9e1b32] text-white py-3 rounded-lg font-bold text-sm hover:bg-[#7a1527] transition-colors shadow-md">
                เข้าสู่ระบบ (SSO Login)
            </button>
        </form>

        <div class="bg-gray-50 px-8 py-4 border-t text-center text-xs text-gray-500">
            © 2026 Srinakharinwirot University
        </div>
    </div>

</body>
</html>
